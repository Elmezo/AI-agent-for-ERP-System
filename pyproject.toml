[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-erp-agent"
version = "0.1.0"
description = "Dynamic, config-driven LangGraph agent over an ERP API catalog."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools]
packages = ["src", "mock_erp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
